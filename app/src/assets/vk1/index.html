<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VK-1</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
  /* touch has no hover: keep the menu button reachable */
  .dshvk1-btn{opacity:1 !important;pointer-events:auto !important}
</style>
</head>
<body>
<script>
// Without this the WebView claims the gesture as a scroll and fires pointercancel,
// which killed every drag (rice bowls, the iron pot) a few pixels in.
document.addEventListener('touchmove', function (e) { e.preventDefault() }, { passive: false })
window.addEventListener('error', function (e) {
  try { if (window.VK1) VK1.log('ERR ' + (e.message || '') + ' @' + (e.filename || '') + ':' + (e.lineno || 0)); } catch (x) {}
});
window.addEventListener('unhandledrejection', function (e) {
  try { if (window.VK1) VK1.log('REJ ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); } catch (x) {}
});
window.addEventListener('load', function () {
  try {
    if (window.VK1) VK1.log('page load ok ' + innerWidth + 'x' + innerHeight + ' dpr=' + devicePixelRatio);
  } catch (x) {}
});
</script>
<script src="widget.js"></script>
</body>
</html>
